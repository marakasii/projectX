[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "visapilot-backend"
version = "0.1.0"
description = "Local synthetic-data VisaPilot prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "pwdlib[argon2]>=0.3,<1",
    "pypdf==6.10.0",
    "pypdfium2==5.14.0",
    "Pillow==12.3.0",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*", "data*"]
namespaces = false

[tool.setuptools.package-data]
"app.common" = ["schema.sql"]
"data.rules.destinations" = ["*.json", "*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
